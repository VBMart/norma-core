; NC lamp head controller: AI-Thinker ESP32-CAM in the head + Waveshare Bus Servo Adapter (A) + 5x ST3215 + WS2812 ring.
; First flash over the CP2102 adapter (IO0 to GND, press RST):   pio run -e espcam -t upload --upload-port COMx
; Later flashes over Wi-Fi:                                      pio run -e ota -t upload
; Serial log:                                                    pio device monitor -p COMx
[env]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv          ; two 1.9 MB app slots for OTA
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ESP32Async/AsyncTCP @ ^3.3.0
    bblanchon/ArduinoJson @ ^7.3.0
    adafruit/Adafruit NeoPixel @ ^1.12.3

[env:espcam]
upload_speed = 460800

[env:ota]
upload_protocol = espota
upload_port = lamp.local
